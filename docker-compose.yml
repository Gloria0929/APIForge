services:
  apiforge:
    build: .
    # 本地构建产物固定命名为 apiforge
    image: apiforge
    # 一键更新会按这个名字查找并重建容器，必须固定
    container_name: apiforge
    ports:
      - "3000:3000"
    # 容器内访问宿主机上的本地模型服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - apiforge-data:/app/data
      # 一键更新需要容器内能操作宿主机 Docker
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - DB_TYPE=sqlite
      - DB_SQLITE_PATH=/app/data/apiforge.db
      - PORT=3000
      # 更新检测与拉取的镜像。
      # 镜像内已通过 ENV 固化了 DOCKER_IMAGE（构建时写入），默认跟随镜像即可：
      # 拉哪个仓库的镜像，就从哪个仓库检查更新。
      # 只有需要强制指定（例如镜像来自 Docker Hub，但想从国内仓库更新）时才取消下面一行。
      # - DOCKER_IMAGE=${DOCKER_IMAGE:-foehao09/apiforge:latest}
      # 备用镜像源（逗号分隔）：可写完整镜像，或只写注册中心前缀。
      # 镜像内已内置（主源 ACR + 备选 Docker Hub），默认跟随镜像，需要时取消注释覆盖。
      # - DOCKER_IMAGE_MIRRORS=${DOCKER_IMAGE_MIRRORS:-foehao09/apiforge}
      # 更新策略：latest（默认，比较镜像摘要）或 version（比较语义化版本号）
      - UPDATE_TRACK=${UPDATE_TRACK:-latest}
      # 版本清单 JSON 地址（对象存储/CDN），仅 UPDATE_TRACK=version 时使用
      - VERSION_MANIFEST_URL=${VERSION_MANIFEST_URL:-}
      # 私有仓库认证（可选，pull 时使用）
      - DOCKER_REGISTRY_USERNAME=${DOCKER_REGISTRY_USERNAME:-}
      - DOCKER_REGISTRY_PASSWORD=${DOCKER_REGISTRY_PASSWORD:-}
      # 更新时重建容器使用的数据卷，必须是下面实际生成的卷名
      - DOCKER_DATA_VOLUME=apiforge-data
    restart: unless-stopped

volumes:
  apiforge-data:
    # 显式固定卷名。不写 name 时 compose 会按项目名加前缀（目录名 APIForge → apiforge），
    # 实际生成 apiforge_apiforge-data，与容器内 DOCKER_DATA_VOLUME 及文档不一致；
    # 更危险的是换目录名/换机器时会挂到一个全新的空卷上，看起来像数据丢失。
    name: apiforge-data
